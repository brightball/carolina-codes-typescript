# One Gitea Actions job per quality check. Not a single combined job.
#
# act_runner starts a new container per job, so jobs cannot share a live
# image. Prep checks out GITHUB_SHA with the job token over HTTPS, runs
# npm ci, and stages gitleaks, then uploads a workspace tarball. Later
# Node 25 checks restore that artifact and run one gate. Do not git init
# or set init.defaultBranch here. Do not use actions/checkout (Gitea git
# HTTP still 401 without the job token).
name: precommit

on:
  push:
  pull_request:

concurrency:
  group: precommit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  prep:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node:25-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates curl
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: npm ci
      - run: |
          mkdir -p bin
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C bin gitleaks
          chmod +x bin/gitleaks
          bin/gitleaks version
      - run: |
          tar -czf /tmp/prep-workspace.tar.gz .
          mv /tmp/prep-workspace.tar.gz prep-workspace.tar.gz
      - uses: actions/upload-artifact@v3
        with:
          name: prep-workspace
          path: prep-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1

  test:
    needs: prep
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node:25-bookworm
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: prep-workspace
      - run: |
          archive="$(find . -name prep-workspace.tar.gz -print | head -1)"
          test -n "$archive"
          tar -xzf "$archive"
      - run: npm test

  sast:
    needs: prep
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node:25-bookworm
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: prep-workspace
      - run: |
          archive="$(find . -name prep-workspace.tar.gz -print | head -1)"
          test -n "$archive"
          tar -xzf "$archive"
      - run: npm run sast

  audit:
    needs: prep
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node:25-bookworm
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: prep-workspace
      - run: |
          archive="$(find . -name prep-workspace.tar.gz -print | head -1)"
          test -n "$archive"
          tar -xzf "$archive"
      - run: npm run audit

  gitleaks:
    needs: prep
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node:25-bookworm
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: prep-workspace
      - run: |
          archive="$(find . -name prep-workspace.tar.gz -print | head -1)"
          test -n "$archive"
          tar -xzf "$archive"
          install -m 0755 bin/gitleaks /usr/local/bin/gitleaks
          if [ -n "${GITHUB_PATH:-}" ]; then echo "$PWD/bin" >> "$GITHUB_PATH"; fi
      - run: gitleaks detect --source . --verbose

  style:
    needs: prep
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node:25-bookworm
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: prep-workspace
      - run: |
          archive="$(find . -name prep-workspace.tar.gz -print | head -1)"
          test -n "$archive"
          tar -xzf "$archive"
      - run: npm run style
